name: release-regressions

# Full source-engine release suite; opt-in because it hydrates runtime LFS art.
# Native Windows EXE, GPU, packaging and performance acceptance remain separate.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  windows-safety:
    runs-on: windows-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Packaging, candidate locks and publication safety
        shell: powershell
        run: ./tools/ci_windows.ps1 -ReleaseSafetyOnly
  release-suite:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: ./.github/actions/setup-reviewed-godot
      - name: Hydrate runtime assets only
        run: git lfs pull --include="godot/chibi_remake/**" --exclude=""
      - name: Validate runtime asset hashes
        run: |
          node tools/audit_clone_inputs.mjs --index
          node tools/runtime_assets.mjs --check --hash --versioned-only
      - name: Source engine release suite
        run: node tools/run_regressions.mjs --engine "$GODOT_ENGINE" --suite tools/inputs/release_tests.json --selftest-failures --output _work/hosted-release
      - name: Missing presentation resources and terrain budget recovery
        if: ${{ !cancelled() }}
        run: node tools/test_missing_presentation.mjs --engine "$GODOT_ENGINE" --output _work/hosted-presentation-failures
      - name: CPU hot path latency and query budgets
        if: ${{ !cancelled() }}
        run: node tools/benchmark_hot_paths.mjs --engine "$GODOT_ENGINE" --output _work/hosted-hot-paths
      - name: Upload release evidence
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: source-release-regressions
          path: |
            _work/hosted-release
            _work/hosted-presentation-failures/results.json
            _work/hosted-presentation-failures/*.log
            _work/hosted-hot-paths/results.json
            _work/hosted-hot-paths/*.log
