name: contracts

# Repository contracts that need no engine, no export templates and no LFS art:
# composition registry, layer boundaries, declared runtime assets and the
# complete test inventory. Engine-only simulation gates live in ci.yml;
# full source release regressions have an explicit workflow_dispatch entry.
on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  contracts:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Architecture and waiver reviews
        if: ${{ !cancelled() }}
        run: node tools/ci_lightweight.mjs --group architecture
      - name: Composition registry
        if: ${{ !cancelled() }}
        run: node tools/ci_lightweight.mjs --group registry
      - name: Simulation data and rules manifest
        if: ${{ !cancelled() }}
        run: node tools/ci_lightweight.mjs --group data
      - name: Documentation
        if: ${{ !cancelled() }}
        run: node tools/ci_lightweight.mjs --group docs
      - name: Repository syntax and complete test inventory
        if: ${{ !cancelled() }}
        run: node tools/ci_lightweight.mjs --group repository
      - name: Tooling contracts
        if: ${{ !cancelled() }}
        run: node tools/ci_lightweight.mjs --group tooling
      - name: Indexed asset declarations and LFS pointers
        if: ${{ !cancelled() }}
        run: node tools/audit_clone_inputs.mjs --index
      - name: Rebuildable terrain source declarations
        if: ${{ !cancelled() }}
        run: node tools/terrain_sources.mjs --index
      - name: Historical terrain equivalence reference coverage
        if: ${{ !cancelled() }}
        run: node tools/compare_terrain_rebuild.mjs --declarations
      - name: Upload check summaries
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: contract-results
          path: _work/lightweight
